[workspace]
members = ["macros"]

[package]
name = "ignition"
version = "1.0.0"
edition = "2024"
links = "ignition_sys"
license = "MIT"

[lib]
name = "ignition"
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
ignition-macros = { path = "macros", version = "1.0.0" }
thiserror = "1.0"
serde_yaml = "0.9"

[build-dependencies]
ignition-macros = { path = "macros", version = "1.0.0" }
thiserror = "1.0"
serde_yaml = "0.9"

[features]
default = ["download-onnxruntime", "download-opencv"]
download-onnxruntime = []
download-opencv = []
