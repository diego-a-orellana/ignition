[workspace]
members = ["macros"]

[package]
name = "ignition"
version = "1.0.0"
edition = "2024"
links = "ignition_sys"
license = "MIT"

[lib]
name = "ignition"
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
ignition-macros = { path = "macros", version = "1.0.0" }
thiserror = "1.0"
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "2.12", optional = true }

[build-dependencies]
ignition-macros = { path = "macros", version = "1.0.0" }
thiserror = "1.0"
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "2.12", optional = true }

[features]
default = ["download-onnxruntime", "download-opencv"]
# Asset retrieval, enabled by any `download-<asset>` feature
download = ["dep:flate2", "dep:tar", "dep:ureq"]
download-onnxruntime = ["download"]
download-opencv = ["download"]
