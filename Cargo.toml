[workspace]
members = ["macros"]

[package]
name = "ignition-rs"
description = "Build-time retrieval of precompiled dependencies."
documentation = "https://docs.rs/ignition-rs"
edition = "2024"
license = "MIT"
links = "ignition_sys"
readme = "README.md"
repository = "https://github.com/diego-a-orellana/ignition"
rust-version = "1.89"
version = "1.0.0"

[lib]
name = "ignition"
crate-type = ["lib"]
doctest = false
test = false

[dependencies]
ignition-macros = { package = "ignition-macros-rs", path = "macros", version = "1.0.0" }
thiserror = "1.0"
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "2.12", optional = true }

[build-dependencies]
ignition-macros = { package = "ignition-macros-rs", path = "macros", version = "1.0.0" }
thiserror = "1.0"
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "2.12", optional = true }

[features]
default = []
# Asset retrieval, enabled by any `download-<asset>` feature
download = ["dep:flate2", "dep:tar", "dep:ureq"]
download-onnxruntime = ["download"]
download-opencv = ["download"]
