[package]
name = "ignition-macros-rs"
description = "Supporting macros for Ignition."
documentation = "https://docs.rs/ignition-rs"
edition = "2024"
license = "MIT"
repository = "https://github.com/diego-a-orellana/ignition/tree/1.0.0"
version = "1.0.0"

[lib]
proc-macro = true
name = "ignition_macros"

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
syn = "2.0"
